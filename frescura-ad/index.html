<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --noir: #0c0a09;
        --ivory: #f5efe6;
        --gold: #d9b779;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--noir); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--noir); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">
      <div id="ground"></div>

      <!-- Scenes: one per beat of the voiceover (film time = voice time + 0.10 s) -->
      <div id="hook"    data-composition-id="hook"    data-composition-src="compositions/hook.html"    data-start="0"     data-duration="4.7"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="myth"    data-composition-id="myth"    data-composition-src="compositions/myth.html"    data-start="4.7"   data-duration="3.7"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="basics"  data-composition-id="basics"  data-composition-src="compositions/basics.html"  data-start="8.4"   data-duration="5.85" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="small"   data-composition-id="small"   data-composition-src="compositions/small.html"   data-start="14.25" data-duration="2.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="foam"    data-composition-id="foam"    data-composition-src="compositions/foam.html"    data-start="16.3"  data-duration="3.1"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="brand"   data-composition-id="brand"   data-composition-src="compositions/brand.html"   data-start="19.4"  data-duration="4.6"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="choose"  data-composition-id="choose"  data-composition-src="compositions/choose.html"  data-start="24"    data-duration="2"    data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="stock"   data-composition-id="stock"   data-composition-src="compositions/stock.html"   data-start="26"    data-duration="2.9"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="cta"     data-composition-id="cta"     data-composition-src="compositions/cta.html"     data-start="28.9"  data-duration="3.7"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="32.6"  data-duration="2.4"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <!-- Persistent boutique frame + brand bug -->
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-duration="35" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>

      <!-- Every caption group lives in this one host -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="35" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:6"></div>

      <!-- Voice (cleaned) + music bed + SFX, mixed by scripts/mix_audio.py -->
      <audio id="mix" class="clip" src="assets/audio/mix.m4a" data-start="0" data-duration="35" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
