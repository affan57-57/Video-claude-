<!-- HyperFrames sub-composition "hud" — mounted at root 0s. All data-start values and timeline positions here are local. -->
<template id="hud-template">
  <div data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-root" class="fill">
      <div class="fill hud">
        <div class="abs logo" style="left: 70px; top: 80px; font-family: var(--disp); font-size: 34px; letter-spacing: 0.32em">FRESCURA</div>
        <div class="abs lab tag" style="right: 70px; top: 88px; font-size: 20px">Ocean salt series</div>
        <div class="abs rail" style="left: 40px; top: 330px; width: 3px; height: 1260px; background: rgba(255, 255, 255, 0.18)">
          <div class="rf" style="width: 100%; height: 100%; background: currentColor; transform-origin: 50% 0%"></div>
        </div>
        <div class="abs ix" style="left: 70px; top: 130px; font-weight: 800; font-size: 26px; letter-spacing: 0.2em">
          <span>01 / 03</span><span>02 / 03</span><span>03 / 03</span>
        </div>
      </div>
      <div class="fill iris" style="clip-path: circle(0% at 50% 50%)"></div>
    </div>
    <style>
      #hud-root .hud {
        color: var(--hudc, #ffffff);
      }
      #hud-root .ix span {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        opacity: 0;
      }
    </style>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const at = HF.at(0);
        const rnd = HF.rng(305);
        const q = (s) => document.querySelector("#hud-root " + s);
        const qa = (s) => Array.from(document.querySelectorAll("#hud-root " + s));
        const hud = q(".hud");
        tl.fromTo(q(".rf"), { scaleY: 0 }, { scaleY: 1, duration: 45, ease: "none" }, 0);
        tl.set(hud, { "--hudc": "#121212" }, 5.04).set(hud, { "--hudc": "#ffffff" }, 18.46);
        tl.set(q(".rail"), { background: "rgba(18,18,18,.15)" }, 5.04).set(q(".rail"), { background: "rgba(255,255,255,.18)" }, 18.46);
        const ix = qa(".ix span");
        [
          [5.04, 9.2],
          [9.2, 12.88],
          [12.88, 18.46],
        ].forEach(([a, b], i) => {
          tl.fromTo(ix[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, a + 0.05);
          tl.to(ix[i], { opacity: 0, duration: 0.12 }, b - 0.12);
        });
        // porthole iris transitions: close on the cut, open on the next scene
        const iris = q(".iris");
        [
          [5.04, "#f3f0ea"],
          [18.46, "#0e2735"],
          [21.88, "#0e2735"],
          [37.4, "#121212"],
          [41.2, "#0e2735"],
        ].forEach(([t, c]) => {
          tl.set(iris, { background: c }, t - 0.34);
          tl.fromTo(
            iris,
            { clipPath: "circle(0% at 50% 50%)" },
            { clipPath: "circle(75% at 50% 50%)", duration: 0.32, ease: "power2.in", immediateRender: false },
            t - 0.33,
          );
          tl.to(iris, { clipPath: "circle(0% at 50% 50%)", duration: 0.4, ease: "power3.out" }, t + 0.01);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["hud"] = tl;
      })();
    </script>
  </div>
</template>
