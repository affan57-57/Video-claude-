<!-- HyperFrames sub-composition "captions" — mounted at root 0s. All data-start values and timeline positions here are local. -->
<template id="captions-template">
  <div data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="captions-root" class="fill">
      <div class="fill caps"></div>
    </div>
    <style>
      #captions-root {
        --capc: #ffffff;
        --capem: #e0b58f;
        --capbox: #9cc3c9;
        --capon: #121212;
        --capshadow: 0 2px 4px rgba(0, 0, 0, 0.5), 0 4px 30px rgba(0, 0, 0, 0.6);
      }
      #captions-root .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1320px;
        text-align: center;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 84px;
        line-height: 1.12;
        letter-spacing: -0.025em;
        color: var(--capc);
        text-shadow: var(--capshadow);
        opacity: 0;
      }
      #captions-root .w {
        display: inline-block;
        position: relative;
        margin: 0 0.12em;
        padding: 0 0.08em;
      }
      #captions-root .w.e {
        color: var(--capem);
        font-family: var(--it);
        font-style: italic;
        font-weight: 700;
        font-size: 1.18em;
        letter-spacing: 0;
        line-height: 0.9;
      }
      #captions-root .w .bx {
        position: absolute;
        left: -6px;
        right: -6px;
        top: 8%;
        bottom: 4%;
        border-radius: 14px;
        background: var(--capbox);
        z-index: -1;
        transform: scaleX(0);
        transform-origin: 0 50%;
      }
    </style>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const at = HF.at(0);
        const rnd = HF.rng(288);
        const q = (s) => document.querySelector("#captions-root " + s);
        const qa = (s) => Array.from(document.querySelectorAll("#captions-root " + s));
        const root = q(".caps").parentElement;
        // paper scenes 5.04–18.46: dark ink captions; variant scenes 30–37.4: names shown on panels, captions hidden
        tl.set(root, { "--capc": "#121212", "--capem": "#a8683c", "--capbox": "#d6e8ea", "--capshadow": "0 0 0 rgba(0,0,0,0)" }, 5.04);
        tl.set(
          root,
          { "--capc": "#ffffff", "--capem": "#e0b58f", "--capbox": "#9cc3c9", "--capshadow": "0 2px 4px rgba(0,0,0,.5), 0 4px 30px rgba(0,0,0,.6)" },
          18.46,
        );
        const HIDE = [[30.0, 37.4]];
        window.CAPTIONS.forEach((chunk, i) => {
          const s = chunk[0][1];
          if (HIDE.some(([a, b]) => s >= a && s < b)) return;
          const d = document.createElement("div");
          d.className = "cap";
          chunk.forEach(([w, ws, we, em]) => {
            const sp = document.createElement("span");
            sp.className = "w" + (em ? " e" : "");
            sp.textContent = w;
            sp.dataset.s = ws;
            const bx = document.createElement("i");
            bx.className = "bx";
            sp.appendChild(bx);
            d.appendChild(sp);
          });
          q(".caps").appendChild(d);
          const next = window.CAPTIONS[i + 1];
          let e = next ? Math.min(next[0][1], chunk[chunk.length - 1][2] + 0.6) : 44.7;
          HIDE.forEach(([a]) => {
            if (s < a && e > a) e = a;
          });
          tl.fromTo(d, { autoAlpha: 0, y: 26, scale: 0.96 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.16, ease: P }, s);
          tl.to(d, { autoAlpha: 0, duration: 0.07 }, Math.max(s + 0.2, e - 0.06));
          Array.from(d.children).forEach((w) => {
            const t = Math.max(s, +w.dataset.s - 0.03);
            const bx = w.querySelector(".bx");
            tl.fromTo(w, { opacity: 0.45 }, { opacity: 1, duration: 0.1 }, t);
            if (!w.classList.contains("e")) {
              tl.fromTo(bx, { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: P, immediateRender: false }, t);
              const light = t >= 5.04 && t < 18.46;
              tl.to(w, { color: "#121212", textShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.08 }, t + 0.04);
              tl.to(bx, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.14 }, t + 0.34);
              tl.to(
                w,
                {
                  color: light ? "#121212" : "#ffffff",
                  textShadow: light ? "0 0 0 rgba(0,0,0,0)" : "0 2px 4px rgba(0,0,0,.5), 0 4px 30px rgba(0,0,0,.6)",
                  duration: 0.08,
                },
                t + 0.36,
              );
            } else {
              tl.fromTo(w, { scale: 0.85 }, { scale: 1.06, duration: 0.2, ease: B, immediateRender: false }, t);
            }
          });
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>
