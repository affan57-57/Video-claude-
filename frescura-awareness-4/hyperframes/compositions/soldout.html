      <div

          style="

            font-weight: 800;
            font-size: 104px;

          "

          SOLD OUT
        </div>

    <style></style>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const at = HF.at(36.76);
        const rnd = HF.rng(382);
        const q = (s) => document.querySelector("#soldout-root " + s);
        const qa = (s) => Array.from(document.querySelectorAll("#soldout-root " + s));
        tl.fromTo(q(".bgi"), { scale: 1.2 }, { scale: 1.08, duration: 3.1, ease: "none" }, 0);
        tl.fromTo(HF.glyphs(q(".t1")), { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.025, ease: E }, 0.02);
        tl.fromTo(q(".t2"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, at(37.8));
        tl.fromTo(q(".sign"), { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: B }, at(38.6));
        const letters = HF.glyphs(q(".tx"));
        tl.fromTo(letters, { opacity: 0 }, { opacity: 1, duration: 0.02, stagger: 0.06 }, at(38.8));
        [39.3, 39.38, 39.46, 39.54].forEach((t, i) => tl.to(q(".sign"), { opacity: i % 2 ? 1 : 0.35, duration: 0.03 }, at(t)));
        window.__timelines = window.__timelines || {};
        window.__timelines["soldout"] = tl;
      })();
