<!-- HyperFrames sub-composition "captions" — mounted at root 0s. data-start values and timeline positions are local. -->
<template id="captions-template">
  <div data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="captions-root" class="fill">
      <div class="fill caps"></div>
    </div>
    <style>
      #captions-root .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1330px;
        text-align: center;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 86px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: #fff;
        opacity: 0;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 0.6),
          0 4px 30px rgba(0, 0, 0, 0.7);
      }
      #captions-root .cap::before {
        content: "";
        display: block;
        width: 110px;
        height: 2px;
        margin: 0 auto 22px;
        background: linear-gradient(90deg, rgba(216, 181, 106, 0), #d8b56a, rgba(216, 181, 106, 0));
      }
      #captions-root .w {
        display: inline-block;
        margin: 0 0.13em;
      }
      #captions-root .w.e {
        color: #f0d9a4;
        font-family: var(--it);
        font-style: italic;
        font-weight: 400;
        font-size: 1.16em;
        letter-spacing: 0;
        line-height: 0.9;
      }
    </style>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const at = HF.at(0);
        const rnd = HF.rng(477);
        const q = (s) => document.querySelector("#captions-root " + s);
        const qa = (s) => Array.from(document.querySelectorAll("#captions-root " + s));
        const HIDE = [[28.2, 33.92]];
        window.CAPTIONS.forEach((chunk, i) => {
          const s = chunk[0][1];
          if (HIDE.some(([a, b]) => s >= a && s < b)) return;
          const d = document.createElement("div");
          d.className = "cap";
          chunk.forEach(([w, ws, we, em]) => {
            const sp = document.createElement("span");
            sp.className = "w" + (em ? " e" : "");
            sp.textContent = w;
            sp.dataset.s = ws;
            d.appendChild(sp);
          });
          q(".caps").appendChild(d);
          const next = window.CAPTIONS[i + 1];
          let e = next ? Math.min(next[0][1], chunk[chunk.length - 1][2] + 0.6) : 52.8;
          HIDE.forEach(([a]) => {
            if (s < a && e > a) e = a;
          });
          tl.fromTo(d, { autoAlpha: 0, y: 24, scale: 0.97 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.16, ease: P }, s);
          tl.to(d, { autoAlpha: 0, duration: 0.07 }, Math.max(s + 0.2, e - 0.06));
          Array.from(d.children).forEach((w) => {
            const t = Math.max(s, +w.dataset.s - 0.03);
            tl.fromTo(w, { opacity: 0.35, y: 6 }, { opacity: 1, y: 0, duration: 0.12, ease: P }, t);
            tl.fromTo(
              w,
              { textShadow: "0 0 0 rgba(255,236,190,0)" },
              { textShadow: "0 0 26px rgba(255,236,190,.85)", duration: 0.1, immediateRender: false },
              t,
            );
            tl.to(w, { textShadow: "0 2px 4px rgba(0,0,0,.6), 0 4px 30px rgba(0,0,0,.7)", duration: 0.2 }, t + 0.3);
          });
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>
