<template>
  <style>
    @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/BodoniModa.woff2") format("woff2"); font-weight: 400 900; font-style: normal; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/PlusJakartaSans.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0d0a0e; font-family: "Plus Jakarta Sans", sans-serif; color: #f5efe6; }
    #stock-glow { position: absolute; left: -200px; top: 200px; width: 1480px; height: 1300px; background: radial-gradient(closest-side, rgba(150,30,48,0.55), rgba(13,10,14,0)); }
    #stock-bottle { position: absolute; left: 540px; top: 520px; width: 620px; height: 1100px; object-fit: cover; object-position: 78% 50%; opacity: 0.32; -webkit-mask-image: radial-gradient(closest-side, #000 45%, transparent 100%); mask-image: radial-gradient(closest-side, #000 45%, transparent 100%); }
    #stock-ghost { position: absolute; left: 0; top: 790px; width: 1080px; text-align: center; font-weight: 800; font-size: 250px; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 2px rgba(217,183,126,0.28); }
    #stock-wrap { position: absolute; left: 90px; top: 250px; width: 900px; }
    #stock-label { font-weight: 700; font-size: 30px; letter-spacing: 0.42em; color: #d9b77e; }
    #stock-pct { font-family: "Bodoni Moda", serif; font-weight: 500; font-size: 300px; line-height: 1; margin-top: 10px; font-variant-numeric: lining-nums tabular-nums; }
    #stock-pct small { font-size: 140px; }
    #stock-track { position: relative; margin-top: 30px; width: 900px; height: 18px; border-radius: 9px; background: rgba(245,239,230,0.14); overflow: hidden; }
    #stock-bar { position: absolute; left: 0; top: 0; width: 900px; height: 18px; border-radius: 9px; background: #d9b77e; transform-origin: 0 50%; }
    #stock-chip { display: inline-flex; align-items: center; gap: 14px; margin-top: 40px; padding: 16px 30px; border-radius: 40px; background: #e0464b; color: #fff; font-weight: 800; font-size: 34px; letter-spacing: 0.14em; }
    #stock-chip i { width: 16px; height: 16px; border-radius: 50%; background: #fff; display: inline-block; }
  </style>
  <div id="root" data-composition-id="stock" data-width="1080" data-height="1920">
    <div id="stock-glow"></div>
    <img id="stock-bottle" src="assets/img/duo.jpg" alt="" data-layout-ignore />
    <div id="stock-ghost" data-layout-ignore>TERHAD</div>
    <div id="stock-wrap">
      <div id="stock-label">BAKI STOK</div>
      <div id="stock-pct"><b id="stock-n">100</b><small>%</small></div>
      <div id="stock-track"><div id="stock-bar"></div></div>
      <div id="stock-chip"><i></i>HAMPIR HABIS</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#stock-glow", { opacity: 0.3, scale: 0.9 }, { opacity: 1, scale: 1.05, duration: 2.65, ease: "power1.out" }, 0);
    tl.fromTo("#stock-bottle", { x: 80, opacity: 0 }, { x: 0, opacity: 0.32, duration: 1.2, ease: "expo.out" }, 0);
    tl.fromTo("#stock-ghost", { opacity: 0,  }, { opacity: 1, duration: 1.6, ease: "expo.out" }, 0.1);
    tl.fromTo("#stock-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.0);
    tl.fromTo("#stock-pct", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.0);
    tl.fromTo("#stock-track", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.15);
    // stock drains in steps (each step on a tick sound), lands at 9% on the ping
    // stock drains in steps (each step on a tick sound) and lands at 9% on the ping;
    // one proxy drives both the number and the bar so any seek shows the right value
    const steps = [[0.5, 72], [0.8, 48], [1.1, 31], [1.4, 18], [1.75, 9]];
    const valueAt = (t) => {
      let v = 100, prev = 100;
      for (const [st, to] of steps) {
        if (t >= st + 0.18) { v = to; prev = to; continue; }
        if (t > st) { const k = 1 - Math.pow(1 - (t - st) / 0.18, 3); v = prev + (to - prev) * k; }
        break;
      }
      return v;
    };
    const prog = { t: 0 };
    const draw = () => {
      const v = valueAt(prog.t);
      document.querySelector("#stock-n").textContent = String(Math.round(v)).padStart(2, "0");
      document.querySelector("#stock-bar").style.transform = "scaleX(" + (v / 100) + ")";
    };
    tl.fromTo(prog, { t: 0 }, { t: 2.65, duration: 2.65, ease: "none", onUpdate: draw, onStart: draw }, 0);
    tl.fromTo("#stock-bar", { backgroundColor: "#d9b77e" }, { backgroundColor: "#e0464b", duration: 0.3 }, 1.2);
    tl.fromTo("#stock-pct", { color: "#f5efe6" }, { color: "#ff6b6b", duration: 0.3 }, 1.35);
    tl.fromTo("#stock-chip", { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.75);
    tl.fromTo("#stock-chip i", { opacity: 1 }, { opacity: 0.2, duration: 0.01 }, 2.15);
    tl.fromTo("#stock-chip i", { opacity: 0.2 }, { opacity: 1, duration: 0.01 }, 2.35);
    window.__timelines["stock"] = tl;
  </script>
</template>
