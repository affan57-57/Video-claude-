<style>
#g-bg{background:radial-gradient(ellipse 80% 55% at 50% 55%,#3a1a1e 0%,#140b0b 60%,#0b0908 100%)}

<div id="g-bg" class="full"></div>

</div>

<script>
tl.fromTo("#g-k",{opacity:0,scale:1.2,filter:"blur(8px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:.5,ease:"expo.out"},0.02);
tl.fromTo("#g-t",{opacity:0,filter:"blur(14px)"},{opacity:1,filter:"blur(0px)",duration:.35,ease:"power3.out"},0.55);

tl.fromTo(".g-sp",{opacity:0,scale:0},{opacity:1,scale:1.4,duration:.25,ease:"back.out(3)",stagger:.03},2.62);
tl.to(".g-sp",{y:-160,duration:.5,ease:"power2.in",stagger:.03},2.88);
tl.to("#g-flash",{opacity:1,duration:.22,ease:"power2.in"},3.02);
