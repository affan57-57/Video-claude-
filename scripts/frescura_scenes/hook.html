<style>
#h-bg{background:radial-gradient(ellipse 70% 45% at 50% 38%,#2a1d15 0%,#0b0908 70%)}

#h-kick{top:700px}

#h-ghostR,#h-ghostC{top:900px;font-size:220px;font-weight:800;line-height:1;letter-spacing:-.02em;opacity:0;mix-blend-mode:screen}

<div id="h-bg" class="full"></div>

  <path class="hb" d="M150 240 H250"/><path class="hb" d="M85 170 H55 M315 170 H345"/>
  <path class="hb" d="M140 300 V350 M260 300 V350"/>
</svg>
<div id="h-kick" class="abs center kick">Suami-suami,</div>
<div id="h-l1" class="abs center ital">korang ingat isteri ni</div>
<div id="h-ghostR" class="abs center serif">ROBOT?</div>
<div id="h-ghostC" class="abs center serif">ROBOT?</div>

<div id="h-strike" class="abs"></div>
<script>
gsap.utils.toArray(S+".hb").forEach(p=>{const L=p.getTotalLength?p.getTotalLength():600;gsap.set(p,{strokeDasharray:L,strokeDashoffset:L*0.15});tl.to(p,{strokeDashoffset:0,duration:.6,ease:"power2.out"},0);});
tl.fromTo("#h-bot",{scale:1.12,opacity:.85},{scale:1,opacity:1,duration:.7,ease:"expo.out"},0);
tl.fromTo("#h-kick",{opacity:1,scale:1.15},{scale:1,duration:.6,ease:"expo.out"},0);
tl.fromTo("#h-l1",{opacity:0,filter:"blur(10px)"},{opacity:1,filter:"blur(0px)",duration:.2,ease:"power3.out"},.8);
tl.fromTo("#h-l2 span",{opacity:0,y:60,scaleY:1.4},{opacity:1,y:0,scaleY:1,duration:.28,ease:"expo.out",stagger:.035},1.58);
[[1.62,14,-8],[1.68,-10,6],[1.74,6,-4],[1.80,0,0]].forEach(([t,dx,dy])=>{tl.set("#h-ghostR",{opacity:dx?0.8:0,x:dx,y:dy},t);tl.set("#h-ghostC",{opacity:dx?0.8:0,x:-dx,y:-dy},t);});
tl.to("#h-eyeL,#h-eyeR",{attr:{r:3},duration:.08,ease:"power2.in"},1.62).to("#h-eyeL,#h-eyeR",{attr:{r:18},duration:.1},1.72);
tl.fromTo("#h-strike",{scaleX:0},{scaleX:1,duration:.22,ease:"power4.out"},1.98);
tl.to("#h-bot",{opacity:.35,duration:.2},1.98);
tl.to("#root",{opacity:1,duration:.01},2.27);
</script>
