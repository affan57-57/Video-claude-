<!-- HyperFrames sub-composition: stock (root time 40.5s). Timing inside is local to this composition. -->
<template id="stock-template">
  <div data-composition-id="stock" data-width="1080" data-height="1920" class="comp-root">
    <div id="s12" class="clip scene linen" data-start="0" data-duration="1.86">
      <div class="abs cx eyebrow t0">Peringatan</div>
      <div class="abs cx mar t1">Stok <span class="ser" style="color: var(--rouge)">kami</span></div>
      <div class="grid"></div>
      <div class="abs stamp">STOK TERHAD</div>
    </div>
    <script>
      (function () {
        const base = gsap.timeline({ paused: true });
        const tl = HF.shift(base, 40.5);
        const rnd = HF.rng(1261852256);
        const kb = (sel, t, d, a, b, x = 0) => tl.fromTo(sel, { scale: a, xPercent: x }, { scale: b, xPercent: -x, duration: d, ease: "power1.out" }, t);
        // ---------- S12 stock ----------
        const grid = $("#s12 .grid");
        const minis = [];
        for (let i = 0; i < 10; i++) {
          const d = document.createElement("div");
          d.innerHTML =
            '<svg width="80" height="170" viewBox="0 0 250 560"><path d="M95 20 h70 v40 h-20 v40 h40 a20 20 0 0 1 20 20 v400 a20 20 0 0 1 -20 20 h-120 a20 20 0 0 1 -20 -20 v-400 a20 20 0 0 1 20 -20 h40 v-40 h-30z" fill="' +
            (i < 2 ? "#a51e2e" : "#1b1a17") +
            '" /></svg>';
          d.style.textAlign = "center";
          grid.appendChild(d);
          minis.push(d);
        }
        tl.fromTo("#s12 .t0", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 40.52);
        tl.fromTo("#s12 .t1", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: E }, 40.55);
        tl.fromTo(minis, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.25, stagger: 0.03, ease: P }, 40.6);
        minis
          .slice(2)
          .reverse()
          .forEach((m, i) => tl.to(m, { autoAlpha: 0.12, scale: 0.85, duration: 0.15 }, 41.1 + i * 0.1));
        tl.fromTo("#s12 .stamp", { autoAlpha: 0, scale: 2.4 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.in" }, 41.95);

        window.__timelines = window.__timelines || {};
        window.__timelines["stock"] = base;
      })();
    </script>
  </div>
</template>
