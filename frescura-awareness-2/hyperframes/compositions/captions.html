<!-- HyperFrames sub-composition: captions (root time 0s). Timing inside is local to this composition. -->
<template id="captions-template">
  <div data-composition-id="captions" data-width="1080" data-height="1920" class="comp-root">
    <div id="caps" class="clip" data-start="0" data-duration="45"></div>
    <script>
      (function () {
        const base = gsap.timeline({ paused: true });
        const tl = HF.shift(base, 0);
        const rnd = HF.rng(639641237);
        const kb = (sel, t, d, a, b, x = 0) => tl.fromTo(sel, { scale: a, xPercent: x }, { scale: b, xPercent: -x, duration: d, ease: "power1.out" }, t);
        // ---------- light scenes: ink captions ----------
        const LIGHT = [
          [4.62, 10.0],
          [14.42, 18.46],
          [40.5, 42.36],
        ];
        LIGHT.forEach(([a, b]) => {
          tl.set("#caps", { "--capc": "#1b1a17", "--capem": "#8a6a35", "--capbar": "rgba(143,165,138,.45)", "--capshadow": "0 0 0 rgba(0,0,0,0)" }, a);
          tl.set(
            "#caps",
            {
              "--capc": "#ffffff",
              "--capem": "#e2c793",
              "--capbar": "rgba(143,165,138,.9)",
              "--capshadow": "0 2px 4px rgba(0,0,0,.55), 0 4px 34px rgba(0,0,0,.65)",
            },
            b,
          );
        });

        // ---------- captions ----------
        const caps = $("#caps");
        const HIDE = [];
        window.CAPTIONS.forEach((chunk, i) => {
          const d = document.createElement("div");
          d.className = "cap";
          chunk.forEach(([w, s, e, em]) => {
            const sp = document.createElement("span");
            sp.className = "w" + (em ? " e" : "");
            sp.textContent = w;
            sp.dataset.s = s;
            const u = document.createElement("u");
            sp.appendChild(u);
            d.appendChild(sp);
          });
          caps.appendChild(d);
          const s = chunk[0][1],
            next = window.CAPTIONS[i + 1];
          const e = next ? Math.min(next[0][1], chunk[chunk.length - 1][2] + 0.6) : 44.6;
          tl.fromTo(d, { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.16, ease: P }, s);
          tl.to(d, { autoAlpha: 0, duration: 0.07 }, Math.max(s + 0.2, e - 0.06));
          Array.from(d.children).forEach((w) => {
            const t = Math.max(s, +w.dataset.s - 0.03);
            tl.fromTo(w, { opacity: 0.4 }, { opacity: 1, duration: 0.1 }, t);
            tl.fromTo(w.querySelector("u"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: P }, t);
            tl.to(w.querySelector("u"), { scaleX: 0, transformOrigin: "100% 50%", duration: 0.14 }, t + 0.32);
          });
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = base;
      })();
    </script>
  </div>
</template>
